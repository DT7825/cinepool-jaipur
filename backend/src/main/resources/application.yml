server:
  port: 8080
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/picturehouse?serverTimezone=UTC}
    username: ${DATABASE_USER:picturehouse_app}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
app:
  city: Jaipur
  currency: INR
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  clerk:
    issuer-url: ${CLERK_ISSUER_URL:}
    jwks-url: ${CLERK_JWKS_URL:}
    allowed-origins: ${CLERK_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  mail:
    from: ${TICKET_EMAIL_FROM:}
  admin:
    clerk-user-ids: ${ADMIN_CLERK_USER_IDS:}
